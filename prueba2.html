<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de la Ciudad</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .map-container {
            position: relative;
            display: inline-block;
        }
        .map-image {
            width: 800px;
            transition: filter 0.3s;
        }
        .building {
            position: absolute;
            width: 50px;
            height: 50px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .building img {
        width: 100%; /* Ajusta el ancho al contenedor */
        height: auto; /* Mantén la proporción */
        display: block; /* Asegura que se comporte como un bloque */
        margin: 0 auto; /* Centra la imagen horizontalmente */
        }
        .building:hover {
            transform: scale(1.2);
        }
        .tooltip {
            display: none;
            position: absolute;
            background: white;
            padding: 5px;
            border: 1px solid black;
            font-size: 14px;
            white-space: nowrap;
            text-align: center;
        }
        .tooltip img {
            width: 100px;
            height: auto;
            display: block;
            margin: 5px auto;
        }
    </style>
</head>
<body>
    <h1>Mapa Interactivo de la Ciudad</h1>
    <div class="map-container" id="mapContainer">
        <img src="mapa.jpg" alt="Mapa de la Ciudad" class="map-image" id="mapImage">
        
        <!-- Edificios -->
        <div class="building" style="left: 200px; top: 150px;" data-image="pin.png" data-url="https://ejemplo.com/iglesia">
            <img src="pin.png">
        </div>
        <div class="building" style="left: 400px; top: 300px;" data-image="ayuntamiento.jpg" data-url="https://ejemplo.com/ayuntamiento"></div>
        <div class="building" style="left: 600px; top: 250px;" data-image="biblioteca.jpg" data-url="https://ejemplo.com/biblioteca"></div>
    </div>
    
    <script>
        document.querySelectorAll('.building').forEach(building => {
            let imageName = building.getAttribute('data-image');
            let buildingName = imageName.split('.')[0]; // Extraer el nombre sin la extensión
            buildingName = buildingName.charAt(0).toUpperCase() + buildingName.slice(1); // Capitalizar primera letra

            let tooltip = document.createElement('div');
            tooltip.className = 'tooltip';
            tooltip.innerHTML = `<img src="${imageName}" alt="${buildingName}"><br>${buildingName}`;
            document.body.appendChild(tooltip);
            
            building.addEventListener('mouseenter', function(event) {
                tooltip.style.display = 'block';
                tooltip.style.left = (event.pageX + 10) + 'px';
                tooltip.style.top = (event.pageY + 10) + 'px';
                document.getElementById('mapImage').style.filter = 'blur(3px)';
            });
            
            building.addEventListener('mouseleave', function() {
                tooltip.style.display = 'none';
                document.getElementById('mapImage').style.filter = 'none';
            });
            
            building.addEventListener('mousemove', function(event) {
                tooltip.style.left = (event.pageX + 10) + 'px';
                tooltip.style.top = (event.pageY + 10) + 'px';
            });
            
            building.addEventListener('click', function() {
                window.location.href = building.getAttribute('data-url');
            });
        });
    </script>
</body>
</html>
